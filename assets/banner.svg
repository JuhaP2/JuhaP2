<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050B1A"/>
      <stop offset="1" stop-color="#0B1E3A"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6A6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2EE6A6" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#3FA9F5" stop-opacity=".5"/>
      <stop offset="0.85" stop-color="#9B6CFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9B6CFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .title { font: 800 64px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #EAF6FF; letter-spacing: 3px; }
      .wave  { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .fade  { opacity: 0; animation: fade 1.4s ease-out .2s forwards; }
      .fade2 { opacity: 0; animation: fade 1.4s ease-out .7s forwards; }
      .slogan { font: italic 500 24px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #2EE6A6; letter-spacing: 1px; }
      .star  { fill: #EAF6FF; animation: twinkle 3s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes twinkle { 50% { opacity: .2; } }
    </style>
  </defs>
  <path fill="url(#sky)" d="M0 0H1200V180C1080 205 960 165 840 172C720 180 640 212 520 206C400 200 320 168 200 174C110 178 50 198 0 194Z"/>
  <g filter="url(#blur)">
    <path class="wave" fill="url(#aurora)" d="M-60 70C120 20 260 110 440 70S760 10 940 60S1180 110 1260 60V110C1100 150 960 90 800 120S500 160 320 120S60 100 -60 130Z"/>
    <path class="wave2" fill="url(#aurora)" opacity=".6" d="M-60 40C160 90 300 20 500 50S820 100 1000 40S1200 30 1260 50V80C1080 110 920 60 760 90S460 100 300 80S80 60 -60 90Z"/>
  </g>
  <g>
    <circle class="star" cx="90" cy="30" r="1.6"/>
    <circle class="star" cx="260" cy="150" r="1.2" style="animation-delay:.8s"/>
    <circle class="star" cx="410" cy="22" r="1.4" style="animation-delay:1.6s"/>
    <circle class="star" cx="780" cy="28" r="1.3" style="animation-delay:.4s"/>
    <circle class="star" cx="960" cy="150" r="1.5" style="animation-delay:2.2s"/>
    <circle class="star" cx="1120" cy="36" r="1.2" style="animation-delay:1.2s"/>
  </g>
  <path fill="#0B1E3A" opacity=".9" d="M0 194L60 150L95 172L150 120L205 168L240 146L300 178L0 200Z"/>
  <path fill="#0B1E3A" opacity=".9" d="M1200 194L1150 140L1110 170L1060 118L1010 165L970 145L920 180L1200 200Z"/>
  <g class="fade"><text class="title" x="600" y="98" text-anchor="middle">Juha Pulkka</text></g>
  <g class="fade2"><text class="slogan" x="600" y="140" text-anchor="middle">Code with sisu. Ship with style.</text></g>
</svg>
